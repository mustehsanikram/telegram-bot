[project]
name = "stylebot"
version = "0.1.0"
description = "Telegram bot that manages private-channel subscriptions for a personal styling business"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "apscheduler>=3.11",
    "pydantic-settings>=2.7",
    "aiosqlite>=0.20",
    "asyncpg>=0.31.0",
]

[project.scripts]
stylebot = "stylebot.__main__:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stylebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
